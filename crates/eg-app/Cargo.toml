[package]
name = "eg-app"
version = "0.1.0"
edition = "2024"
description = "Feel the beat, follow the line."
repository = "https://github.com/egakareta/egakareta"
license-file = "LICENSE"
default-run = "egakareta"

[lib]
name = "egakareta_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "egakareta"
path = "src/main.rs"

[features]
benchmarks = []

[dependencies]
bevy_app = { workspace = true }
eg-blocks = { workspace = true }
eg-types = { workspace = true }
eg-game = { workspace = true }
eg-mesh = { workspace = true }
eg-platform = { workspace = true }
eg-render = { workspace = true }
eg-state = { workspace = true }
eg-ui = { workspace = true }
pollster = { workspace = true }
log = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
egui-phosphor = { workspace = true }
puffin = { workspace = true }
winit = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = { workspace = true, features = ["default"] }
env_logger = { workspace = true }
image = { workspace = true, features = ["ico"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { workspace = true }
console_log = { workspace = true }
egui-winit = { workspace = true, default-features = false }     # default features include arboard, which doesnt have wasm support yet https://github.com/1Password/arboard/pull/160
gloo-console = { workspace = true }
js-sys = { workspace = true }
parking_lot_core = { workspace = true, features = ["nightly"] }
puffin = { workspace = true, features = ["web"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
wasm-bindgen-rayon = { workspace = true }
web-sys = { workspace = true }

[package.metadata.wasm-pack.profile.profiling]
wasm-opt = false

[build-dependencies]
serde = { workspace = true }
serde_cbor = { workspace = true }
serde_json = { workspace = true }
winres = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
criterion = { workspace = true }
naga = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
eg-state = { workspace = true, features = ["test-support"] }

[[bench]]
name = "perf_hot_paths"
harness = false
required-features = ["benchmarks"]

[package]
name = "eg-ui"
version = "0.1.0"
edition = "2021"
description = "egakareta egui interface components"
license = "AGPL-3.0-only"

[dependencies]
eg-types = { workspace = true }
eg-blocks = { workspace = true }
eg-state = { workspace = true }
egui = { workspace = true }
egui-phosphor = { workspace = true }
glam = { workspace = true }
puffin = { workspace = true }
puffin_egui = { workspace = true }
image = { workspace = true, features = ["png"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }

[dev-dependencies]
eg-state = { workspace = true, features = ["test-support"] }
pollster = { workspace = true }

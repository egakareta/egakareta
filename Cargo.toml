[workspace]
members = [
    "crates/eg-app",
    "crates/eg-audio",
    "crates/eg-types",
    "crates/eg-block-geometry",
    "crates/eg-blocks",
    "crates/eg-codec",
    "crates/eg-editor-domain",
    "crates/eg-game",
    "crates/eg-level",
    "crates/eg-mesh",
    "crates/eg-platform",
    "crates/eg-render",
    "crates/eg-state",
    "crates/eg-ui",
    "crates/egb",
]
resolver = "2"
default-members = ["crates/eg-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "Feel the beat, follow the line."
repository = "https://github.com/egakareta/egakareta"
license = "AGPL-3.0-only"

[workspace.dependencies]
async-trait = "0.1"
approx = "0.5"
bevy = { version = "0.19", default-features = false, features = [
    "bevy_clipboard",
    "bevy_state",
    "bevy_material",
    "bevy_log",
    "bevy_pbr",
    "bevy_render",
] }
bevy_egui = "0.41"
bytemuck = { version = "1.25", features = ["derive"] }
console_error_panic_hook = "0.1"
console_log = "1.0.0"
cpal = { version = "0.17", features = ["wasm-bindgen", "audioworklet"] }
criterion = "0.7"
eg-audio = { path = "crates/eg-audio" }
eg-block-geometry = { path = "crates/eg-block-geometry" }
eg-blocks = { path = "crates/eg-blocks" }
eg-codec = { path = "crates/eg-codec" }
eg-editor-domain = { path = "crates/eg-editor-domain" }
eg-game = { path = "crates/eg-game" }
eg-level = { path = "crates/eg-level" }
eg-mesh = { path = "crates/eg-mesh" }
eg-platform = { path = "crates/eg-platform" }
eg-render = { path = "crates/eg-render" }
eg-state = { path = "crates/eg-state" }
eg-types = { path = "crates/eg-types" }
eg-ui = { path = "crates/eg-ui" }
egui = "0.34.3"
egui-phosphor = "0.12.0"
egui-wgpu = "0.34.3"
egui-winit = { version = "0.34.3", default-features = false }
env_logger = "0.11"
glam = { version = "0.33", features = ["bytemuck"] }
gloo-console = "0.4"
gloo-file = "0.4"
gloo-net = "0.7"
gloo-utils = "0.3"
futures = "0.3"
image = { version = "0.25", default-features = false }
include_dir = "0.7"
js-sys = "0.3"
log = "0.4"
naga = { version = "29", features = ["wgsl-in"] }
opfs = "0.2"
parking_lot_core = { version = "0.9.12", features = ["nightly"] }
paste = "1.0.15"
pollster = "0.4"
puffin = { git = "https://github.com/EmbarkStudios/puffin", rev = "7e08a533f9debfb7d051547263d2ab84c666314f" }
puffin_egui = { git = "https://github.com/EmbarkStudios/puffin", rev = "7e08a533f9debfb7d051547263d2ab84c666314f" }
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
rfd = "0.17"
rodio = { version = "0.22", default-features = false, features = [
    "mp3",
    "playback",
    "vorbis",
    "wasm-bindgen",
    "wav",
] }
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1"
sha2 = "0.11"
smart-default = "0.7"
smart-is-default = "0.2"
symphonia = { version = "0.6", default-features = false, features = [
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-bindgen-rayon = "1"
web-sys = { version = "0.3", features = [
    "Clipboard",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "Location",
    "Navigator",
    "Window",
] }
web-time = "1.1"
wgpu = { version = "29.0.3", features = ["webgpu", "webgl"] }
winit = "0.30"
winres = "0.1"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
zstd = "0.13"

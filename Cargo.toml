[workspace]
members = [
    "crates/eg-app",
    "crates/eg-types",
    "crates/eg-block-geometry",
    "crates/eg-blocks",
    "crates/eg-codec",
    "crates/eg-editor-domain",
    "crates/eg-game",
    "crates/eg-level",
    "crates/eg-mesh",
    "crates/eg-platform",
    "crates/eg-render",
    "crates/eg-state",
    "crates/eg-ui",
    "crates/egb",
    "crates/terrarium/",
    ".",
]
resolver = "2"
default-members = [".", "crates/eg-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "Feel the beat, follow the line."
repository = "https://github.com/egakareta/egakareta"
documentation = "https://docs.rs/egakareta"
license = "AGPL-3.0-only"

[workspace.dependencies]
async-trait = "0.1.92"
approx = "0.5.1"
bevy_app = "0.19.1"
bevy_clipboard = "0.19.1"
bevy_ecs = "0.19.1"
bevy_state = "0.19.1"
bevy_tasks = "0.19.1"
bevy_time = "0.19.1"
bevy_egui = "0.42.0"
bytemuck = { version = "1.25.2", features = ["derive"] }
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
criterion = { version = "0.8.2", default-features = false, features = [
    "plotters",
    "cargo_bench_support",
] }
eg-block-geometry = { path = "crates/eg-block-geometry" }
eg-blocks = { path = "crates/eg-blocks" }
eg-codec = { path = "crates/eg-codec" }
eg-editor-domain = { path = "crates/eg-editor-domain" }
eg-game = { path = "crates/eg-game" }
eg-level = { path = "crates/eg-level" }
eg-mesh = { path = "crates/eg-mesh" }
eg-platform = { path = "crates/eg-platform" }
eg-render = { path = "crates/eg-render" }
eg-state = { path = "crates/eg-state" }
eg-types = { path = "crates/eg-types" }
eg-ui = { path = "crates/eg-ui" }
egui = "0.35.0"
egui-phosphor = "0.13.0"
egui-wgpu = "0.35.0"
egui-winit = { version = "0.35.0", default-features = false, features = [
    "links",
    "wayland",
    "x11",
] }
env_logger = "0.11.11"
glam = { version = "0.33.5", features = ["bytemuck"] }
gloo-console = "0.4.0"
gloo-file = "0.4.0"
gloo-net = "0.7.0"
gloo-utils = "0.3.0"
futures = "0.3.34"
image = { version = "0.25.10", default-features = false, features = [
    "ico",
    "png",
] }
include_dir = "0.7.4"
js-sys = "0.3.104"
log = "0.4.33"
naga = { version = "29.0.4", features = ["wgsl-in"] }
opfs = "0.2.0"
parking_lot_core = { version = "0.9.12", features = ["nightly"] }
paste = "1.0.15"
pollster = "1.0.1"
puffin = { git = "https://github.com/EmbarkStudios/puffin", rev = "d06bed0fcb8c8e4c78643d4ead7cf1de9b76fd3b" }
puffin_egui = { git = "https://github.com/EmbarkStudios/puffin", rev = "d06bed0fcb8c8e4c78643d4ead7cf1de9b76fd3b" }
rayon = "1.12.0"
reqwest = { version = "0.13.4", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
] }
rfd = "0.17.2"
euphorium = { version = "0.4.0", default-features = false, features = [
    "mp3",
    "nightly",
    "vorbis",
    "wav",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_cbor = "0.11.2"
serde_json = "1.0.151"
sha2 = "0.11.0"
smart-default = "0.7.1"
smart-is-default = "0.2.0"
tempfile = "3.27.0"
terrarium = { path = "crates/terrarium/" }
tokio = { version = "1.53.1", features = ["rt", "macros"] }
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.77"
wasm-bindgen-rayon = "1.3.0"
web-sys = { version = "0.3.104", features = [
    "Clipboard",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "Location",
    "Navigator",
    "Window",
] }
web-time = "1.1.0"
wgpu = { version = "29.0.4", features = ["webgpu", "webgl"] }
winit = "0.30.13"
winresource = "0.1.31"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
zstd = "0.13.3"

[package]
name = "monorepo"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
documentation.workspace = true
license.workspace = true
publish = false

[dependencies]
bevy_app = { workspace = true }
bevy_clipboard = { workspace = true }
bevy_ecs = { workspace = true }
bevy_state = { workspace = true }
bevy_tasks = { workspace = true }
bevy_time = { workspace = true }
eg-block-geometry = { workspace = true }
eg-blocks = { workspace = true }
eg-codec = { workspace = true }
eg-editor-domain = { workspace = true }
eg-game = { workspace = true }
eg-level = { workspace = true }
eg-mesh = { workspace = true }
eg-platform = { workspace = true }
eg-render = { workspace = true }
eg-state = { workspace = true }
eg-types = { workspace = true }
eg-ui = { workspace = true }
terrarium = { workspace = true }

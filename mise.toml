[tools]
"github:taiki-e/cargo-llvm-cov" = "latest"
"github:egakareta/renfs" = "latest"
"github:Unreal-Works/license-check-and-add" = "0.4.0"
oxfmt = "latest"
bun = "latest"
clang = "latest"
lefthook = "latest"
node = "latest"
rust = { version = "nightly-2026-03-12", components = [
    "clippy",
    "rustfmt",
    "rust-src",
] }
supabase = "latest"

[hooks]
postinstall = ["bun install", "lefthook install"]

[tasks.build]
description = "Build game for the web (pass --dev for faster builds)"
run = "bun scripts/build.ts"

[tasks.vendor]
description = "Re-download vendored dependencies"
run = "renfs web/zenfs.js"

[tasks."bench"]
description = "Run .rs benchmarks"
run = "cargo bench --workspace --benches --features benchmarks"

[tasks.check]
description = "Run all linting and formatting checks"
run = "mise lint && mise format:cargo --check && mise format:oxfmt --check"

[tasks.format]
description = "Format .rs/.toml/.yml"
depends = ["format:cargo", "format:oxfmt"]

[tasks."format:cargo"]
description = "Format .rs"
run = "cargo fmt --all -- --config-path .config/rustfmt.toml"

[tasks."format:oxfmt"]
description = "Format .toml/.yml"
run = "oxfmt"

[tasks.lint]
description = "Lint .rs"
run = "cargo clippy --all-targets --all-features --workspace -- -D warnings"

# Typegen
[tasks."cf-typegen"]
description = "Regenerate Cloudflare type definitions"
run = "bunx wrangler types --strict-vars=false --env-interface CloudflareEnv functions/cloudflare-env.d.ts"

[tasks."sb-ts-typegen"]
description = "Regenerate Supabase TypeScript definitions"
run = "supabase gen types typescript --local > functions/_supabase_types.ts"

[tasks.typegen]
description = "Regenerate all type definitions"
depends = ["cf-typegen", "sb-ts-typegen"]

[tasks.test]
description = "Run .rs tests"
run = "cargo test --workspace -- -Zunstable-options --format=terse"

[tasks."test:coverage"]
description = "Run .rs tests with coverage"
run = """
cargo llvm-cov --workspace --no-report -- -Zunstable-options --report-time
cargo llvm-cov report --lcov --output-path lcov.info
cargo llvm-cov report
"""

[tasks."test:functions"]
description = "Run Cloudflare Pages tests"
run = "bunx vitest run --config .config/vitest.config.mts"

[tasks."test:db"]
description = "Run Supabase tests"
run = "supabase test db"

# License
[tasks."license:add"]
description = "Add license headers to project files"
run = "license-check-and-add add -f .config/license/config.json"

[tasks."license:check"]
description = "Check license headers existence in project files"
run = "license-check-and-add check -f .config/license/config.json"

# Development
[tasks.dev]
description = "Continuously watch for changes to build for the web"
run = "bun scripts/dev.ts"

[tasks."dev:setup"]
description = "Set up the development environment for the first time"
run = """
supabase start
until supabase status; do sleep 2; done
supabase status -o env > .env.local
mise run typegen
rustup toolchain install
"""

[settings]
cargo.binstall = true
cargo.binstall_quickinstall = true

[bootstrap.packages]
"apt:build-essential" = "latest"
"apt:curl" = "latest"
"apt:ca-certificates" = "latest"
"apt:git" = "latest"
"apt:git-lfs" = "latest"
"apt:pkg-config" = "latest"
"apt:libssl-dev" = "latest"
"apt:clang" = "latest"
"apt:cmake" = "latest"
"apt:gnupg" = "latest"
"apt:wget" = "latest"
"apt:unzip" = "latest"
"apt:libclang-dev" = "latest"
"apt:libasound2-dev" = "latest"
"apt:libasound2-plugins" = "latest"
"apt:libmariadb-dev" = "latest"
"apt:libudev-dev" = "latest"
"apt:libxkbcommon-dev" = "latest"
"apt:libxkbcommon-x11-dev" = "latest"
"apt:libwayland-dev" = "latest"
"apt:libx11-dev" = "latest"
"apt:libxcursor-dev" = "latest"
"apt:libxi-dev" = "latest"
"apt:libxrandr-dev" = "latest"
"apt:libvulkan-dev" = "latest"
"apt:libfontconfig1-dev" = "latest"

name: CI/CD

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  checks:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    environment: preview
    env:
      BUILD_ENV: preview
    steps:
      - uses: actions/checkout@v6
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libasound2-dev libudev-dev pkg-config
          version: 1.0
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
      - run: mise format:cargo -- --check
      - run: mise format:prettier -- --check
      - run: mise lint

  test-rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    environment: preview
    env:
      BUILD_ENV: preview
    steps:
      - uses: actions/checkout@v6
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libasound2-dev libudev-dev pkg-config mesa-vulkan-drivers libvulkan1 vulkan-tools
          version: 1.0
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      - run: rustc --version
      - run: cargo --version
      - run: mise test:coverage
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info

  test-functions:
    name: Test Functions
    runs-on: ubuntu-latest
    environment: preview
    env:
      BUILD_ENV: preview
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: mise test:functions --coverage
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: functions

  test-db:
    name: Test Database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: supabase start
      - run: mise test:db

  build-web:
    name: Build WebAssembly
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    env:
      BUILD_ENV: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2

      - name: Build WebAssembly
        run: mise build

      - name: Package WebAssembly
        if: github.event_name == 'push'
        run: zip -r egakareta-web.zip dist

      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: egakareta-web
          path: egakareta-web.zip
          retention-days: 1

  build-native:
    name: Build Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: egakareta-linux
            binary_path: target/x86_64-unknown-linux-gnu/release/egakareta
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: egakareta-windows
            binary_path: target/x86_64-pc-windows-msvc/release/egakareta.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: egakareta-macos
            binary_path: target/x86_64-apple-darwin/release/egakareta
    runs-on: ${{ matrix.os }}
    environment: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    env:
      BUILD_ENV: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v6
      - if: matrix.os == 'ubuntu-latest'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libasound2-dev libudev-dev pkg-config
          version: 1.0
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2

      - name: Build ${{ matrix.artifact_name }}
        run: cargo build --release --verbose --target ${{ matrix.target }}

      - name: Package ${{ matrix.artifact_name }} (Windows)
        if: matrix.os == 'windows-latest' && github.event_name == 'push'
        run: Compress-Archive -Path ${{ matrix.binary_path }} -DestinationPath ${{ matrix.artifact_name }}.zip
      - name: Package ${{ matrix.artifact_name }} (Unix)
        if: matrix.os != 'windows-latest' && github.event_name == 'push'
        run: zip -j ${{ matrix.artifact_name }}.zip ${{ matrix.binary_path }}

      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
          retention-days: 1

  release:
    name: Create Release
    needs: [build-web, build-native]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Get current date
        id: date
        run: echo "today=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.date.outputs.today }}
          tag_name: release-${{ steps.date.outputs.today }}-${{ github.run_number }}
          files: artifacts/*.zip
          draft: true

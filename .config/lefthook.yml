pre-commit:
  parallel: true
  commands:
    license:
      run: mise exec -- license-check-and-add check -f .config/license/config.json {staged_files}
      stage_fixed: true
    oxfmt:
      glob: "*.{js,jsx,ts,tsx,json,css,scss,md,toml,yml,yaml}"
      run: mise exec -- oxfmt --no-error-on-unmatched-pattern --write {staged_files}
      stage_fixed: true
    rustfmt:
      glob: "*.rs"
      run: mise exec -- cargo fmt --all
      stage_fixed: true
